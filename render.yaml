services:
  - type: web
    name: capstone_3-1
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GITHUB_TOKEN
        sync: false
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_UNTIL
        value: "2026-11-08"
